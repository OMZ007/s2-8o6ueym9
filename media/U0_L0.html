================================================================================
AI DESIGN BRIEF · SAMAI 2 page template  (hidden — never rendered)
Full rules: ../SAMAI2-DESIGN-GUIDE.md — the FOUNDATION (read it first; it wins over this summary).
Every element has a fixed PATTERN there (hero, trail, cards, terms explorer, quiz…):
when you meet one, apply its pattern; never redesign it. Most complete reference
page: U4_L0.html (same folder) — start new pages from it.

WHAT THIS IS
- One self-contained Arabic RTL HTML page per programme item. Pages are linked in order:
  user-approved previous/next links at the end of each original page (2026-10-08).
- This file is the reference. New pages reuse its tokens, components and motion
  exactly, so every page looks generated at the same time by the same hand.

HARD RULES
1. Educational text is locked: copy approved titles/lessons/paragraphs exactly —
   never add, drop, reword or "improve" a character. UI labels (counts like
   "درسان", kickers) may be written/corrected. Never invent content.
2. Use only the :root tokens. No raw colours, radii, spacings or shadows.
   Text colours: --ink #1F2A37 · --text-primary #002366 · --text #384250 ·
   --muted #6C737F · --on #FFF · --on-2 #FFF 80% · --on-3 #FFF 70%. Nothing else.
   Surfaces: white page + navy tints (--navy-50…900). Accent: --brand-teal only.
   Questions / quizzes / self-checks always wear the GREEN family (--a-50…900),
   same shapes and states, so they never read as explanation.
3. Radius 8 (chips, rows, icon tiles, buttons) · 12 (cards, panels) · 20 (hero).
   Space on the 4px scale (--space-1…8). Controls 32 / 40 / 48 px.
4. Font: IBM Plex Sans Arabic. Icons: Font Awesome 6.5 solid, decorative
   (aria-hidden). No emoji, no illustrations of people, no playful colours.
5. Header = copy the .bar block verbatim (logo data-URI, sticky, 3px brand line).
   First line inside the hero = the .trail (programme › unit › lesson), plain
   text, built from PAGE.trail; the last step is this page's level, its name is h1.
6. Full width: --gutter 80px (40 ≤1100, 24 ≤860, 16 ≤560). Never a max-width.
7. Motion: calm, formal, meaningful, one accent colour; pause off-screen;
   everything still under prefers-reduced-motion. No bounce, no confetti.
8. Clickable things (and only those) get hover/active states + keyboard focus.
9. Content lives in one data object (PROGRAM / UNIT) in the script; markup is built
   from it with the el() helper. Keep that split.
10. Before delivering: no horizontal scroll 320→2560px, no clipped text,
    AA contrast, text diffed against the approved source.
================================================================================
-->

/* ======================================================================
   SAMAI 2 · page template — a small design system
   Every value below comes from the tokens in :root. When building a new
   page, pick from the scales; do not type raw numbers into components.

   Radius   8  small pieces (chips, tags, icon tiles, buttons, list rows)
           12  cards and panels
           20  the hero (the largest radius used anywhere)
   Space    4 · 8 · 12 · 16 · 20 · 24 · 32 · 48 (a 4px grid)
   Sizes    32 small control · 40 medium control · 48 large control
   ====================================================================== */
:root{
  /* ---- colour: text (the approved palette — every text colour is one of these) */
  --ink:#1F2A37;          /* Text Display */
  --text-primary:#002366; /* Text Primary */
  --text:#384250;         /* Text Paragraph Primary */
  --muted:#6C737F;        /* Text Paragraph Secondary */
  --on:#FFFFFF;           /* Text On Color Primary */
  --on-2:#FFFFFFCC;       /* Text On Color Secondary (80%) */
  --on-3:#FFFFFFB3;       /* Text On Color Tertiary (70%) */
  /* ---- colour: brand accents (header line, signals) */
  --brand-primary:#2F3068; --brand-teal:#00AD8B; --brand-green:#7FC242;
  /* ---- colour: surfaces — the navy family (tints of #002366) */
  --navy-900:#00133D; --navy-800:#002366; --navy-700:#0B3572; --navy-600:#1D4A8C;
  --navy-300:#A9BAD6; --navy-200:#D3DDEC; --navy-150:#DCE5F2; --navy-100:#E8EEF7; --navy-50:#F4F7FC;
  --bg:#FFFFFF; --surface:#FFFFFF; --line:#E3E9F2;
  --on-surface-1:#FFFFFF0F; --on-surface-2:#FFFFFF1F; --on-line:#FFFFFF2E; /* glass on navy */

  /* ---- radius */
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  /* ---- space */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px; --space-8:48px;
  /* ---- sizes */
  --control-sm:32px; --control-md:40px; --control-lg:48px;
  /* ---- type */
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --fs-1:13px; --fs-2:14px; --fs-3:15px; --fs-4:16px;
  /* ---- elevation */
  --shadow-sm:0 1px 2px #00133D0A,0 4px 12px #00133D0A;
  --shadow-md:0 12px 28px #00133D17;
  --shadow-lg:0 20px 44px #00133D2E;
  /* ---- layout: one gutter for the header and every section; the page always fills the screen */
  --gutter:80px; --header:68px;
  /* ---- motion */
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header) + var(--space-5))}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.8;font-size:var(--fs-3);-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3{color:var(--ink);margin:0;line-height:1.4}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--text-primary)}
:focus-visible{outline:3px solid #1D4A8C80;outline-offset:2px;border-radius:var(--radius-sm)}
ul,ol{margin:0;padding:0;list-style:none}
.container{width:100%;padding-inline:var(--gutter)}

/* ---- Header (fixed template: identical on every page) -------------------- */
/* stays at the top while the page scrolls; a soft shadow appears once content passes under it */
.bar{position:sticky;top:0;z-index:50;background:var(--surface);transition:box-shadow var(--dur-2) var(--ease)}
.bar.is-stuck{box-shadow:0 6px 18px #00133D14}
.bar::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(to left,var(--brand-primary),var(--brand-teal) 55%,var(--brand-green))}
.bar-inner{height:var(--header);padding:0 var(--gutter) 3px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.bar-logo{display:block;height:38px;width:auto}
.bar-meta{display:flex;align-items:center;gap:var(--space-3);color:var(--muted);font-size:var(--fs-2);font-weight:600}
.bar-meta:empty{display:none}

/* ---- Hero ------------------------------------------------------------------
   Deep navy, calm and formal. The one moving piece is the programme's six
   units on a ring, lit in order. One accent only — the brand teal. */
.hero-wrap{padding-top:var(--space-6)}
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-8);align-items:center;padding:var(--space-7) var(--space-8);border-radius:var(--radius-lg);overflow:hidden;color:var(--on);
  background:radial-gradient(640px 380px at 0% 110%,#00AD8B24,transparent 65%),linear-gradient(135deg,var(--navy-900) 0%,var(--navy-800) 55%,var(--navy-700) 100%);
  box-shadow:var(--shadow-lg),inset 0 0 0 1px #FFFFFF14}
/* ---- Trail: where this page sits — programme › unit › lesson (any depth).
   Plain text, never links: the LMS owns navigation. The last step is this
   page's own level ("الوحدة الأولى", "الدرس الثالث"); its title is the h1. */
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-2);margin:0 0 var(--space-3);padding:0;font-size:clamp(14px,1vw,16px);line-height:1.5}
.trail li{display:inline-flex;align-items:center;gap:var(--space-2);font-weight:500;color:var(--on-2)}
.trail li:first-child::before{content:"";flex:none;width:12px;height:3px;border-radius:2px;background:var(--brand-teal)}
.trail li + li::before{content:"\f053";font:var(--fa-font-solid);font-size:10px;color:var(--on-3)}
.trail li:last-child{font-weight:600;color:var(--on)}
.hero h1{font-size:clamp(28px,2.7vw,52px);font-weight:700;color:var(--on);line-height:1.3;letter-spacing:0;white-space:nowrap}
/* key facts: one panel, the number first so it reads at a glance */
.hero .tags{display:inline-flex;flex-wrap:wrap;margin-top:var(--space-5);padding:var(--space-1);border-radius:var(--radius-md);background:var(--on-surface-1);border:1px solid var(--on-surface-2)}
.hero .stat{display:flex;align-items:center;gap:var(--space-3);min-height:var(--control-lg);padding:0 var(--space-4)}
.hero .stat+.stat{border-inline-start:1px solid var(--on-surface-2)}
.hero .stat i{display:grid;place-items:center;width:var(--control-sm);height:var(--control-sm);border-radius:var(--radius-sm);background:var(--on-surface-2);color:var(--on-2);font-size:var(--fs-2)}
.hero .stat b{font-size:22px;font-weight:700;line-height:1;color:var(--on);font-variant-numeric:tabular-nums}
.hero .stat span{font-size:var(--fs-2);font-weight:500;color:var(--on-2)}
/* the facts sit apart: a small gap, and the divider drawn in the middle of it, so a highlighted fact never touches its neighbour */
.hero .tags{gap:var(--space-1)}
.hero .stat{position:relative}
.hero .stat+.stat{border-inline-start:0}
.hero .stat+.stat::before{content:"";position:absolute;inset-inline-start:calc(var(--space-1) / -2 - .5px);top:25%;bottom:25%;width:1px;background:var(--on-surface-2)}
/* the programme's six units on a ring, lit one after the other in order;
   icons only. The ring is an illustration, so its pieces stay circles. */
.orbit{--o:228px;position:relative;justify-self:center;width:var(--o);height:var(--o)}
.orbit svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit .track{fill:none;stroke:#FFFFFF1F;stroke-width:1.5}
.orbit .arc{fill:none;stroke:var(--brand-teal);stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.orbit .inner{fill:none;stroke:#FFFFFF14;stroke-width:1;stroke-dasharray:2 7;transform-origin:50% 50%;transform-box:view-box;animation:turn 90s linear infinite}
.orbit .spoke{stroke:#FFFFFF12;stroke-width:1;transition:stroke var(--dur-5) var(--ease)}
.orbit .spoke.on{stroke:#00AD8B99}
@keyframes turn{to{transform:rotate(360deg)}}
.orbit .core{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFFFFF1F,#FFFFFF08);border:1px solid var(--on-line);color:var(--on);font-size:calc(var(--o) * .11);box-shadow:0 0 0 6px #FFFFFF06}
.orbit .node{position:absolute;display:grid;place-items:center;width:calc(var(--o) * .18);height:calc(var(--o) * .18);transform:translate(-50%,-50%);border-radius:50%;background:#0A2A5C;border:1px solid #FFFFFF33;color:var(--on-3);font-size:calc(var(--o) * .066);transition:background var(--dur-4) var(--ease),color var(--dur-4) var(--ease),border-color var(--dur-4) var(--ease),box-shadow var(--dur-4) var(--ease),transform var(--dur-4) var(--ease)}
.orbit .node.done{border-color:#00AD8B99;color:var(--on)}
.orbit .node.on{background:var(--surface);border-color:var(--surface);color:var(--text-primary);transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 0 4px #00AD8B38,0 8px 18px #00133D66}
/* on a unit or lesson page the ring is still: the current unit is lit and breathes softly,
   every unit before it carries a small check (passed), the ones after it stay quiet */
.orbit.is-here .node.done{background:#0A3A5C;border-color:#00AD8BB3;color:var(--on)}
.orbit.is-here .node.done::before{content:"\f00c";position:absolute;top:-3px;inset-inline-end:-3px;display:grid;place-items:center;width:calc(var(--o) * .08);height:calc(var(--o) * .08);border-radius:50%;background:var(--brand-teal);box-shadow:0 0 0 2px var(--navy-800);font:var(--fa-font-solid);font-size:calc(var(--o) * .04);color:var(--on)}
.orbit.is-here .spoke.passed{stroke:#00AD8B59}
/* the route: one station per lesson between a unit and the next — passed (teal), this unit's (brighter), the rest (quiet).
   Stations and unit icons are buttons: a tap shows their name in a small card (10 s, or until a tap elsewhere / Esc). */
.orbit .stop{position:absolute;display:grid;place-items:center;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:none;transform:translate(-50%,-50%);cursor:pointer}
.orbit .stop::before{content:"";width:calc(var(--o) * .03);height:calc(var(--o) * .03);border-radius:50%;background:#FFFFFF2E;transition:background var(--dur-2) var(--ease),transform var(--dur-2) var(--ease)}
.orbit .stop.passed::before{background:var(--brand-teal)}
.orbit .stop.ahead::before{background:#FFFFFF99}
.orbit .stop.now::before{background:var(--on);box-shadow:0 0 0 3px #00AD8B59}
.orbit .stop.now::after{content:"";position:absolute;width:calc(var(--o) * .03);height:calc(var(--o) * .03);border-radius:50%;border:1.5px solid var(--brand-teal);animation:stop-here 2.6s var(--ease) infinite}
@keyframes stop-here{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
.orbit button.node{padding:0;font:inherit;cursor:pointer}
@media (hover:hover){
  .orbit .stop:hover::before{transform:scale(1.45)}
  .orbit button.node:not(.on):hover{border-color:#FFFFFF80;color:var(--on)}
}
.orbit .stop:focus-visible,.orbit button.node:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.orbit .is-picked.stop::before{transform:scale(1.45)}
/* the name card: white, small, above (or below) what was tapped, kept inside the hero */
.orbit-tip{position:absolute;z-index:3;max-width:240px;padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--surface);box-shadow:var(--shadow-md);font-size:var(--fs-1);line-height:1.6;text-align:start;opacity:0;transform:translateY(4px);transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease);pointer-events:none}
.orbit-tip.is-on{opacity:1;transform:none}
.orbit-tip small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.orbit-tip b{display:block;font-weight:700;color:var(--text-primary)}
.orbit.is-here .node.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--brand-teal);animation:here 2.6s var(--ease) infinite}
@keyframes here{0%{opacity:.8;transform:scale(.92)}100%{opacity:0;transform:scale(1.45)}}

/* ---- Sections ------------------------------------------------------------ */
.layout{padding-block:var(--space-8)}
.flow{position:relative}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-5)}
.kicker{display:block;margin-bottom:var(--space-1);font-size:var(--fs-1);font-weight:600;color:var(--muted)}
.section-head h2{font-size:clamp(22px,2.2vw,28px);font-weight:700;color:var(--text-primary)}

/* ---- Unit cards: open and close ------------------------------------------
   Closed: a light head in the navy tint. Open (active): the head turns deep
   navy, the number white, and the lessons drop down. The whole head is one
   button inside the unit heading (disclosure pattern).                     */
.path{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-5);align-items:start}
@media (min-width:1600px){.path{grid-template-columns:repeat(3,minmax(0,1fr))}}
.u-card{--pad:var(--space-6);border-radius:var(--radius-md);background:var(--surface);overflow:hidden;border:1px solid var(--navy-200);box-shadow:var(--shadow-sm);transition:box-shadow var(--dur-3) var(--ease),border-color var(--dur-3) var(--ease)}
.u-h{margin:0;font:inherit}
.u-head{display:flex;flex-direction:column;width:100%;padding:0;border:0;background:none;text-align:start;cursor:pointer;font:inherit;color:inherit}
.u-head:focus-visible{outline:3px solid var(--navy-600);outline-offset:-3px;border-radius:var(--radius-md)}
.u-band{display:flex;align-items:center;justify-content:space-between;padding:var(--space-5) var(--pad);background:var(--navy-100);transition:background var(--dur-3) var(--ease)}
.u-num{font-size:40px;font-weight:700;line-height:1;color:var(--text-primary);font-variant-numeric:tabular-nums;transition:color var(--dur-3) var(--ease)}
.u-ic{display:grid;place-items:center;width:var(--control-md);height:var(--control-md);border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--navy-200);color:var(--text-primary);font-size:17px;transition:background var(--dur-3) var(--ease),color var(--dur-3) var(--ease),border-color var(--dur-3) var(--ease)}
.u-main{display:block;padding:var(--space-5) var(--pad)}
/* titles take only the room they need; cards side by side are evened out in the script */
.u-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:clamp(19px,1.75vw,22px);font-weight:700;line-height:1.6;color:var(--text-primary)}
.u-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px dashed var(--navy-200)}
/* chip: the same shape wherever a small label appears */
/* one layer: the icon and the text on the same chip, the same space before the icon as after the text */
.u-count{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--control-sm);padding:0 var(--space-3);border-radius:var(--radius-sm);background:var(--navy-50);font-size:var(--fs-2);font-weight:600;color:var(--text);transition:background var(--dur-3) var(--ease),color var(--dur-3) var(--ease)}
.u-count::before{content:"\f02d";font:var(--fa-font-solid);font-size:12px;color:var(--muted);transition:color var(--dur-3) var(--ease)}
.u-bar .chev{display:grid;place-items:center;width:var(--control-md);height:var(--control-md);border-radius:var(--radius-sm);background:var(--navy-50);border:1px solid var(--navy-100);color:var(--text-primary);font-size:var(--fs-1);transition:transform var(--dur-3) var(--ease),background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease)}
@media (hover:hover){
  .u-head:hover .u-band{background:var(--navy-150)}
  .u-head:hover .chev{border-color:var(--navy-300)}
}
/* open = active */
.unit-row.is-open .u-card{border-color:var(--navy-300);box-shadow:var(--shadow-md)}
.unit-row.is-open .u-band{background:linear-gradient(135deg,var(--navy-900),var(--navy-800) 60%,var(--navy-700))}
.unit-row.is-open .u-num{color:var(--on)}
.unit-row.is-open .u-ic{background:var(--on-surface-2);color:var(--on);border-color:var(--on-line)}
/* open: the chip takes the lesson-number style (navy, white), so it reads as the key to the lessons below */
.unit-row.is-open .u-count{background:var(--navy-800);color:var(--on)}
.unit-row.is-open .u-count::before{color:var(--on)}
.unit-row.is-open .u-bar .chev{transform:rotate(180deg);background:var(--navy-800);border-color:var(--navy-800);color:var(--on)}
/* the fold (hidden from assistive tech while closed) */
.u-fold{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows var(--dur-4) var(--ease),visibility 0s .45s var(--ease)}
.u-fold>div{overflow:hidden}
.unit-row.is-open .u-fold{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows var(--dur-4) var(--ease),visibility 0s var(--ease)}

@container wincomp (max-width:320px){.win-pick>i{display:none}.win-pick{padding-inline:8px}}
/* numbered lists of rows: never wider than their list; the references, when narrow: number, link icon, words under them */
.steps{grid-template-columns:minmax(0,1fr)}
.steps li,.refs .steps a,.steps .txt{min-width:0}
.refs-fold>div{container:refs/inline-size}
@container refs (max-width:520px){
  .refs .steps::before{display:none}
  .refs .steps a{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;row-gap:var(--space-2)}
  .refs .steps a>.num{grid-column:1;grid-row:1}
  .refs .steps a>.ic{grid-column:2;grid-row:1;justify-self:end;margin:0}
  .refs .steps a>.txt{grid-column:1/-1;grid-row:2}
}
/* a folding card's head on narrow screens: icon and title on the first line; the count, then the chevron at the far end */
@media (max-width:600px){
  .refs-head{flex-wrap:wrap;row-gap:var(--space-2)}
  .refs-head::after{content:"";order:3;flex-basis:100%;height:0}
  .refs-head .u-count{order:4}
  .refs-head .chev{order:5;margin-inline-start:auto}
}
/* a long file name (no spaces) never widens its box or a tour (it widened the phone past the screen, owner 2026-10-22): it
   breaks where it must */
.tour-desc,.tour-info>b,:is(.win-file,.ps-file,.pt-userfile,.pt-infile,.rl-file,.pc-file,.th-file-tx,.rw-file,.ru-file,.mb-file,.gc-file,.in-file) :is(span,b){overflow-wrap:anywhere}
/* the sideways tab strips: no fading edges */
.ex-list.more-s,.ex-list.more-e,.more-s.more-e{-webkit-mask-image:none!important;mask-image:none!important}
/* a short English term in brackets inside an Arabic title */
.tf-lat{unicode-bidi:isolate;white-space:nowrap}
/* ==== the smallest screens (t193): less room around, the words keep the width ==== */
@media (max-width:400px){
  :root{--gutter:12px;--band-y:28px;--space-4:12px;--space-5:14px;--space-6:16px;--space-7:24px;--space-8:28px}
}
@media (max-width:320px){
  :root{--gutter:10px;--band-y:24px;--space-3:10px;--space-4:10px;--space-5:12px;--space-6:14px;--space-7:20px;--space-8:24px}
}
/* ==== SAMAI_POLISH_END ==== */
/* ==== the unit's intro video (t194, 2026-10-22) ==== */
.layout>.section.uv{padding-top:var(--space-6);padding-bottom:var(--space-6);border-top:0}
.uv-frame{--uv-h:calc(100svh - var(--header) - 48px);container:uvf/inline-size;position:relative;width:min(100%,calc(var(--uv-h) * 16 / 9));aspect-ratio:16/9;margin-inline:auto;border-radius:var(--radius-md);overflow:hidden;background:#00133D;box-shadow:0 1px 2px #00133D14,0 24px 48px -28px #00133D80;isolation:isolate;outline:none;user-select:none;-webkit-tap-highlight-color:transparent}
.uv-frame:focus-visible{box-shadow:0 0 0 3px #00AD8B66,0 24px 48px -28px #00133D80}
.uv-frame:fullscreen{width:100%;height:100%;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none;background:#000}
.uv-frame:-webkit-full-screen{width:100%;height:100%;border-radius:0}
.uv-frame+.uv-frame{margin-top:var(--space-6)}
.uv-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.uv-frame.is-idle{cursor:none}
/* the cover */
.uv-cover{position:absolute;inset:0;z-index:3;display:grid;grid-template-rows:1fr auto;padding:clamp(16px,3vw,36px);background:linear-gradient(to top,#00133DF2 0%,#00133DB3 38%,#00133D40 72%,#00133D26 100%);color:#fff;transition:opacity .35s var(--ease),visibility 0s .35s}
.uv-frame.is-on .uv-cover{opacity:0;visibility:hidden}
.uv-cover-tx{align-self:end;display:grid;gap:var(--space-2);max-width:min(100%,720px)}
.uv-kick{display:inline-flex;align-items:center;gap:var(--space-2);justify-self:start;min-height:30px;padding:0 var(--space-3);border-radius:999px;background:#FFFFFF1F;border:1px solid #FFFFFF33;font-size:var(--fs-1);font-weight:600;color:#FFFFFFE6;backdrop-filter:blur(6px)}
.uv-kick i{color:#5BE3C3}
.uv-unit{font-size:clamp(13px,1.1vw,15px);font-weight:600;color:#FFFFFFCC}
.uv-title{margin:0;font-size:clamp(20px,2.4vw,34px);font-weight:700;line-height:1.35;color:#fff;text-wrap:balance}
.uv-meta{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--fs-2);color:#FFFFFFCC;font-variant-numeric:tabular-nums}
.uv-big{position:absolute;inset:0;margin:auto;z-index:4;display:grid;place-items:center;width:clamp(64px,8vw,96px);height:clamp(64px,8vw,96px);border:0;border-radius:50%;background:var(--brand-teal);color:#fff;font-size:clamp(22px,2.6vw,32px);cursor:pointer;box-shadow:0 0 0 10px #00AD8B33,0 18px 40px -12px #00000099;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.uv-big i{margin-inline-start:4px}
.uv-big::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #00AD8B66;animation:uvRing 2.4s var(--ease) infinite}
@keyframes uvRing{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@media (hover:hover){.uv-big:hover{transform:scale(1.06);box-shadow:0 0 0 14px #00AD8B40,0 18px 40px -12px #00000099}}
.uv-big:focus-visible{outline:3px solid #fff;outline-offset:4px}
.uv-frame.is-on .uv-big{display:none}
.uv-frame.is-ended .uv-big i{margin:0}
/* the bar */
.uv-bar{position:absolute;inset:auto 0 0;z-index:2;display:grid;gap:6px;padding:28px clamp(10px,1.6vw,18px) clamp(8px,1.2vw,12px);background:linear-gradient(to top,#000000CC,#00000000);color:#fff;opacity:1;transition:opacity .3s var(--ease)}
.uv-frame:not(.is-on) .uv-bar{display:none}
.uv-frame.is-idle .uv-bar{opacity:0;pointer-events:none}
.uv-scrub{position:relative;height:18px;cursor:pointer;touch-action:none}
.uv-track{position:absolute;inset:7px 0;border-radius:3px;background:#FFFFFF40;overflow:hidden;transition:inset .15s var(--ease)}
.uv-scrub:hover .uv-track,.uv-scrub.is-drag .uv-track{inset:6px 0}
.uv-buf,.uv-fill{position:absolute;inset:0 auto 0 0;width:0}
.uv-buf{background:#FFFFFF59}
.uv-fill{background:var(--brand-teal)}
.uv-thumb{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #00AD8B;transform:scale(0);transition:transform .15s var(--ease)}
.uv-scrub:hover .uv-thumb,.uv-scrub:focus-visible .uv-thumb,.uv-scrub.is-drag .uv-thumb{transform:scale(1)}
.uv-scrub:focus-visible{outline:none}
.uv-tip{position:absolute;bottom:22px;padding:2px 8px;border-radius:6px;background:#000000CC;font-size:12px;font-variant-numeric:tabular-nums;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .12s}
.uv-scrub:hover .uv-tip,.uv-scrub.is-drag .uv-tip{opacity:1}
.uv-row{display:flex;align-items:center;gap:4px;min-width:0}
.uv-b{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#fff;font:inherit;font-size:17px;cursor:pointer;transition:background-color .15s var(--ease)}
@media (hover:hover){.uv-b:hover{background:#FFFFFF26}}
.uv-b:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.uv-time{flex:none;padding:0 6px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:#FFFFFFE6;white-space:nowrap}
.uv-sp{flex:1}
.uv-vol{display:flex;align-items:center;gap:2px}
.uv-volr{width:84px;height:4px;accent-color:var(--brand-teal);cursor:pointer}
.uv-rate{width:auto;min-width:52px;padding:0 10px;font-size:14px;font-weight:700}
.uv-ratebox{position:relative}
.uv-menu{position:absolute;bottom:calc(100% + 8px);inset-inline-end:0;display:grid;min-width:120px;padding:6px;border-radius:12px;background:#0B1220F2;box-shadow:0 12px 30px #00000080;backdrop-filter:blur(8px)}
.uv-menu[hidden]{display:none}
.uv-mi{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:0 12px;border:0;border-radius:8px;background:none;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.uv-mi[aria-checked="true"]{background:#00AD8B33;color:#5BE3C3}
@media (hover:hover){.uv-mi:hover{background:#FFFFFF1A}}
/* what a key or a gesture did */
.uv-hud{position:absolute;top:50%;left:50%;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:#000000B3;color:#fff;font-size:15px;font-weight:600;transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.uv-hud.is-on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.uv-seekfx{position:absolute;top:0;bottom:0;z-index:3;display:grid;place-items:center;align-content:center;gap:6px;width:34%;color:#fff;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.uv-seekfx.is-r{right:0;border-radius:50% 0 0 50%/50% 0 0 50%;background:linear-gradient(to left,#FFFFFF2E,transparent)}
.uv-seekfx.is-l{left:0;border-radius:0 50% 50% 0/0 50% 50% 0;background:linear-gradient(to right,#FFFFFF2E,transparent)}
.uv-seekfx.is-on{opacity:1}
.uv-seekfx i{font-size:22px}
/* small pictures */
@media (max-width:600px){
  .layout>.section.uv{padding-top:var(--space-4);padding-bottom:var(--space-4)}
  .uv-frame{border-radius:var(--radius-sm)}
  .uv-cover{padding:14px}
  .uv-kick{min-height:26px;font-size:12px}
  .uv-title{font-size:clamp(16px,4.6vw,20px)}
  .uv-meta{font-size:12px}
  .uv-volr{display:none}
  .uv-b{width:40px;height:40px;font-size:15px}
  .uv-time{font-size:12px;padding:0 2px}
  .uv-bar{padding-top:22px}
}
@media (max-width:360px){.uv-cover-tx .uv-unit{display:none}.uv-rate{min-width:44px;padding:0 6px}}
/* a small picture: the play button at the cover's lower corner, beside the words (never over them) */
@container uvf (max-width:560px){
  .uv-big{inset:auto;left:14px;bottom:14px;margin:0;width:56px;height:56px;font-size:20px;box-shadow:0 0 0 6px #00AD8B33,0 10px 24px -10px #00000099}
  .uv-big::after{inset:-6px}
  .uv-cover-tx{padding-inline-end:72px}
}
@media (prefers-reduced-motion:reduce){.uv-big::after{animation:none}.uv-cover,.uv-bar,.uv-hud,.uv-seekfx{transition:none}}

  const row = el("li", { class: `unit-row u${i + 1} reveal` }, el("article", { class: "u-card" }, el("h3", { class: "u-h" }, head), fold));

});

// Cards side by side get the same height: each title takes the height of the tallest title in its row.
function evenTitles() {
  const titles = $$(".u-title");
  titles.forEach((h) => (h.style.minHeight = ""));
  const rows = new Map();
  titles.forEach((h) => { const top = Math.round(h.closest(".unit-row").offsetTop); rows.set(top, [...(rows.get(top) || []), h]); });
  rows.forEach((hs) => { const max = Math.max(...hs.map((h) => h.offsetHeight)); hs.forEach((h) => (h.style.minHeight = `${max}px`)); });

document.fonts && document.fonts.ready.then(evenTitles);
/* ======================================================================
   Hero: the programme's route — units and their lesson stations — walked in order, again and again
   ====================================================================== */
(function orbit() {
  // the same ring as the unit and lesson pages: six units, and between each unit and the next one station per lesson.
  // Here nobody stands anywhere yet, so a light walks the whole route — unit, its lessons, the next unit … — and starts again.
  const box = $("#orbit"), NS = "http://www.w3.org/2000/svg", C = 160, R = 122;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 320 320");
  const add = (tag, attrs) => { const n = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([a, v]) => n.setAttribute(a, v)); svg.append(n); return n; };
  add("circle", { class: "track", cx: C, cy: C, r: R }); // the route: one line through every unit and station
  const CORE = C * .34; // the centre circle's radius in the drawing (its width is 34% of the ring): the spokes start at its edge
  const at = (i, r = R) => { const a = (-90 + i * (360 / U.length)) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  const spokes = U.map((_, i) => { const [x, y] = at(i), [x0, y0] = at(i, CORE); return add("line", { class: "spoke", x1: x0, y1: y0, x2: x, y2: y }); });
  add("circle", { class: "inner", cx: C, cy: C, r: 78 });
  box.append(svg, el("span", { class: "core", "aria-hidden": "true" }, icon("graduation-cap")));
  const STEP = 360 / U.length, PITCH = 7.5; // a unit's stations sit centred between it and the next unit, the same step apart on every arc
  const stops = U.map((u, i) => u.lessons.map((name, j) => {
    const a = (-90 + (i + 0.5) * STEP + (j - (u.lessons.length - 1) / 2) * PITCH) * Math.PI / 180;
    const x = C + R * Math.cos(a), y = C + R * Math.sin(a);
    const kicker = `${levelLabel({ level: "unit", n: i + 1 })} · ${levelLabel({ level: "lesson", n: j + 1 })}`;
    const b = el("button", { class: "stop", type: "button", style: `left:${x / 3.2}%;top:${y / 3.2}%`, "aria-label": `${kicker}: ${name}` });
    b.addEventListener("click", (e) => { e.stopPropagation(); tip(b, kicker, name); });
    box.append(b);
    return b;
  }));
  const nodes = U.map((u, i) => {
    const [x, y] = at(i), kicker = levelLabel({ level: "unit", n: i + 1 });
    const b = el("button", { class: "node", type: "button", style: `left:${x / 3.2}%;top:${y / 3.2}%`, "aria-label": `${kicker}: ${u.title}` }, icon(u.icon));
    b.addEventListener("click", (e) => { e.stopPropagation(); tip(b, kicker, u.title); });
    box.append(b);
    return b;
  });

  // the walk: unit k, then lesson 1, 2 … of unit k (LESSON = 0 means "at the unit itself")
  const route = U.flatMap((u, i) => [[i, 0], ...u.lessons.map((_, j) => [i, j + 1])]);
  function show(k, LESSON) {
    // only the point the light stands on is lit; the one it leaves returns to its rest (no checks, no trail)
    const atUnit = LESSON === 0;
    nodes.forEach((n, i) => { n.classList.toggle("on", atUnit && i === k); n.classList.remove("done"); });
    spokes.forEach((s, i) => s.setAttribute("class", atUnit && i === k ? "spoke on" : "spoke"));
    stops.forEach((row, i) => row.forEach((b, j) => {
      const state = i === k && j + 1 === LESSON ? "now" : "";
      b.className = `stop ${state}`.trim() + (b.classList.contains("is-picked") ? " is-picked" : "");
    }));
  }
  let step = 0, visible = true, held = false;

  hero.append(card);

  function hide() { card.classList.remove("is-on"); if (picked) picked.classList.remove("is-picked"); picked = null; held = false; clearTimeout(timer); }
  function tip(target, kicker, title) {
    if (picked === target && card.classList.contains("is-on")) { hide(); return; }
    hide(); picked = target; held = true; target.classList.add("is-picked");
    card.replaceChildren(el("small", { text: kicker }), el("b", { text: title }));
    const h = hero.getBoundingClientRect(), r = target.getBoundingClientRect(), w = card.offsetWidth, ht = card.offsetHeight, pad = 12;
    let left = r.left + r.width / 2 - w / 2 - h.left, top = r.top - h.top - ht - 10;
    if (top < pad) top = r.bottom - h.top + 10;
    left = Math.max(pad, Math.min(left, h.width - w - pad));

    timer = setTimeout(hide, 10000);
  }
  document.addEventListener("click", hide);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });
  addEventListener("resize", hide);

  if (reduced) return;
  if ("IntersectionObserver" in window) new IntersectionObserver(([e]) => (visible = e.isIntersecting)).observe(box);

    setTimeout(() => {
      if (visible && !held && !document.hidden && getComputedStyle(box).display !== "none") { step = last ? 0 : step + 1; show(...route[step]); }

})();


if ("IntersectionObserver" in window && !reduced) {

/* ---- hero: a faint light follows the pointer (mouse only, not under reduced motion) ---- */
(function heroLight() {
